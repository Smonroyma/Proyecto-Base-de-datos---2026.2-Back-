# Base de datos H2 basada en archivo (guarda los cambios en la carpeta ./data)
# Modo de compatibilidad estricto con PostgreSQL
spring.datasource.url=jdbc:h2:file:./data/savanadb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Inicialización automática del esquema y los datos iniciales
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Consola web H2 para inspeccionar tablas (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

