spring.application.name=ProyectoFinal _BD1_BACK

# Servidor
server.port=8080

# Persistencia PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:savana_coffee}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Configuración JWT
jwt.secret=${JWT_SECRET:SavanaDataCoffeeSuperSecretSecurityKey2026Secure256BitsLongEnough}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Configuración de Correo Electrónico (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:no-reply@savanacoffee.com}
spring.mail.password=${MAIL_PASSWORD:app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

